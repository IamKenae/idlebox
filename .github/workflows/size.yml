name: Binary Size

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LINUX_RELEASE_TOOLCHAIN: nightly-2026-07-26
  MUSL_BUILD_IMAGE: rustlang/rust:nightly-alpine@sha256:4c0d0569e00356c10a89078870693092e0aaef2515841c33f9e8ca22ce251d6d

jobs:
  size-report:
    name: Linux release size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install size-optimized glibc release toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.LINUX_RELEASE_TOOLCHAIN }}
          components: rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build glibc release
        env:
          CARGO_TARGET_DIR: target/size-glibc
        run: |
          cargo "+${LINUX_RELEASE_TOOLCHAIN}" build \
            --release \
            --locked \
            --target x86_64-unknown-linux-gnu \
            -Z build-std=std,panic_abort \
            -Z build-std-features=optimize_for_size

      - name: Build musl release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/idlebox-size-musl"
          docker run --rm \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/src,readonly" \
            --mount "type=bind,src=${RUNNER_TEMP}/idlebox-size-musl,dst=/target" \
            --env CARGO_TARGET_DIR=/target \
            --workdir /src \
            "${MUSL_BUILD_IMAGE}" \
            sh -euc 'rustup component add rust-src
              cargo build \
                --release \
                --locked \
                --target x86_64-unknown-linux-musl \
                -Z build-std=std,panic_abort \
                -Z build-std-features=optimize_for_size'

      - name: Report release sizes
        shell: bash
        run: |
          set -euo pipefail
          glibc_bytes=$(wc -c < target/size-glibc/x86_64-unknown-linux-gnu/release/idlebox)
          musl_bytes=$(wc -c < "${RUNNER_TEMP}/idlebox-size-musl/x86_64-unknown-linux-musl/release/idlebox")
          glibc_kib=$(((glibc_bytes + 512) / 1024))
          musl_kib=$(((musl_bytes + 512) / 1024))

          {
            echo "## IdleBox Linux release size"
            echo
            echo "| Build | Bytes | Approximate size |"
            echo "|---|---:|---:|"
            echo "| glibc | ${glibc_bytes} | ${glibc_kib} KiB |"
            echo "| musl | ${musl_bytes} | ${musl_kib} KiB |"
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "glibc release: ${glibc_bytes} bytes (${glibc_kib} KiB)"
          echo "musl release: ${musl_bytes} bytes (${musl_kib} KiB)"
