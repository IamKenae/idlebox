name: Binary Size

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LINUX_RELEASE_TOOLCHAIN: nightly-2026-07-26
  MUSL_BUILD_IMAGE: rustlang/rust:nightly-alpine@sha256:4c0d0569e00356c10a89078870693092e0aaef2515841c33f9e8ca22ce251d6d
  GLIBC_MAX_BYTES: 460800
  MUSL_MAX_BYTES: 460800

jobs:
  size-budget:
    name: Linux release budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install size-optimized glibc release toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.LINUX_RELEASE_TOOLCHAIN }}
          components: rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build glibc release
        env:
          CARGO_TARGET_DIR: target/size-glibc
        run: |
          cargo "+${LINUX_RELEASE_TOOLCHAIN}" build \
            --release \
            --locked \
            --target x86_64-unknown-linux-gnu \
            -Z build-std=std,panic_abort \
            -Z build-std-features=optimize_for_size

      - name: Build musl release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/idlebox-size-musl"
          docker run --rm \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/src,readonly" \
            --mount "type=bind,src=${RUNNER_TEMP}/idlebox-size-musl,dst=/target" \
            --env CARGO_TARGET_DIR=/target \
            --workdir /src \
            "${MUSL_BUILD_IMAGE}" \
            sh -euc 'rustup component add rust-src
              cargo build \
                --release \
                --locked \
                --target x86_64-unknown-linux-musl \
                -Z build-std=std,panic_abort \
                -Z build-std-features=optimize_for_size'

      - name: Enforce size budgets
        shell: bash
        run: |
          set -euo pipefail
          glibc_bytes=$(wc -c < target/size-glibc/x86_64-unknown-linux-gnu/release/idlebox)
          musl_bytes=$(wc -c < "${RUNNER_TEMP}/idlebox-size-musl/x86_64-unknown-linux-musl/release/idlebox")
          glibc_remaining=$((GLIBC_MAX_BYTES - glibc_bytes))
          musl_remaining=$((MUSL_MAX_BYTES - musl_bytes))

          {
            echo "## IdleBox Linux release size"
            echo
            echo "| Build | Bytes | Budget | Remaining |"
            echo "|---|---:|---:|---:|"
            echo "| glibc | ${glibc_bytes} | ${GLIBC_MAX_BYTES} | ${glibc_remaining} |"
            echo "| musl | ${musl_bytes} | ${MUSL_MAX_BYTES} | ${musl_remaining} |"
          } >> "${GITHUB_STEP_SUMMARY}"

          failed=0
          if (( glibc_bytes > GLIBC_MAX_BYTES )); then
            echo "::error::glibc release is ${glibc_bytes} bytes; budget is ${GLIBC_MAX_BYTES}"
            failed=1
          fi
          if (( musl_bytes > MUSL_MAX_BYTES )); then
            echo "::error::musl release is ${musl_bytes} bytes; budget is ${MUSL_MAX_BYTES}"
            failed=1
          fi
          exit "${failed}"
