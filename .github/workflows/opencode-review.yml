name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode review
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/mimo-v2.5
          use_github_token: true
          prompt: |
            Review this pull request for the Idlebox project (a lightweight BusyBox alternative in Rust).

            Focus areas:
            - **Correctness**: Logic errors, off-by-one bugs, missing error handling, unsafe code without justification
            - **Rust idioms**: Proper use of Result/Option, avoid unnecessary clones, prefer iterators where clear
            - **Cross-platform**: Changes should work on Linux, macOS, and Windows — flag any platform-specific code that lacks fallbacks
            - **Lightweight principle**: Avoid adding heavy dependencies or unnecessary abstractions; keep the binary small
            - **POSIX compatibility**: Applet behavior should align with common POSIX/GNU conventions
            - **Code quality**: Naming, structure, documentation for public items, test coverage for new applets or logic

            Keep the review concise and actionable. Only flag issues that matter.
