name: CI

on:
  push:
    branches: [main, feat/cross-platform]
  pull_request: {}
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: idlebox-linux-x86_64
            binary_name: idlebox
          - os: macos-latest
            artifact_name: idlebox-macos-native
            binary_name: idlebox
          - os: windows-latest
            artifact_name: idlebox-windows-x86_64
            binary_name: idlebox.exe

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo build
        run: cargo build --verbose

      - name: cargo test
        run: cargo test --verbose

      - name: cargo build --release
        run: cargo build --release --verbose

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/release/${{ matrix.binary_name }}
          retention-days: 30

  cross-compile-check:
    name: Cross-compile check (x86_64-pc-windows-msvc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc

      - name: cargo clippy (windows target)
        run: cargo clippy --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - name: cargo check (windows target)
        run: cargo check --all-targets --target x86_64-pc-windows-msvc

  minimum-toolchain-musl:
    name: Minimum Rust 1.85 & Alpine/musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Test and build in Alpine
        run: |
          docker run --rm \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/src,readonly" \
            --env CARGO_TARGET_DIR=/tmp/idlebox-target \
            --workdir /src \
            rust:1.85-alpine \
            sh -eu -c 'cargo test --all-targets && cargo build --release'
